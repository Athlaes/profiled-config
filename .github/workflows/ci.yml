name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use the stable Rust toolchain
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  snapshot:
    name: Development snapshot
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read the snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml |
              head -n 1
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid workspace snapshot version '$version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Snapshot $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from \`$GITHUB_SHA\` on \`develop\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the snapshot source
        id: snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profiled-config-${{ steps.version.outputs.version }}
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          compression-level: 9
          path: |
            Cargo.toml
            Cargo.lock
            LICENCE
            README.md
            config/
            src/
            profiled-config-macros/Cargo.toml
            profiled-config-macros/src/
            profiled-config-examples/Cargo.toml
            profiled-config-examples/config/
            profiled-config-examples/src/

      - name: Add the artifact link to the summary
        run: |
          echo "Artifact: ${{ steps.snapshot.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
