name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Version, publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      actions: write
      contents: write
      id-token: write

    steps:
      - name: Generate the release app token
        id: release_app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}

      - name: Configure the release app identity
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
        shell: bash
        run: |
          release_app_user_id="$(gh api "/users/$RELEASE_APP_SLUG[bot]" --jq .id)"
          git config user.name "$RELEASE_APP_SLUG[bot]"
          git config user.email "$release_app_user_id+$RELEASE_APP_SLUG[bot]@users.noreply.github.com"

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use the stable Rust toolchain
        run: rustup default stable

      - name: Prepare the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          stable_tags() {
            git tag --list --sort=-version:refname |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' ||
              true
          }

          workspace_version="$(
            sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml |
              head -n 1
          )"

          if [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            release_version="${workspace_version%-SNAPSHOT}"
          elif [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_version="$workspace_version"
          else
            echo "::error::Invalid workspace release version '$workspace_version'; expected X.Y.Z or X.Y.Z-SNAPSHOT"
            exit 1
          fi

          resume_tag=""
          if git rev-parse --verify --quiet "refs/tags/$release_version" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_version")"
            tag_parent="$(git rev-parse "$tag_commit^" 2>/dev/null || true)"

            if [[ "$tag_commit" == "$GITHUB_SHA" || "$tag_parent" == "$GITHUB_SHA" ]] ||
              git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA" ||
              { [[ -n "$tag_parent" ]] &&
                git merge-base --is-ancestor "$tag_parent" "$GITHUB_SHA"; }; then
              resume_tag="$release_version"
              echo "Release $resume_tag is already tagged from this main history; resuming post-release steps."
            fi
          fi

          if [[ -n "$resume_tag" ]]; then
            git checkout --detach "$resume_tag"
            echo "Resuming release $release_version from tag $resume_tag."
          else
            remote_main="$(git rev-parse origin/main)"
            if [[ "$remote_main" != "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
              echo "::error::main advanced after this workflow started; a newer run will release it"
              exit 1
            fi

            latest_tag="$(stable_tags | head -n 1)"

            if [[ -n "$latest_tag" ]] &&
              { [[ "$release_version" == "$latest_tag" ]] ||
                [[ "$(printf '%s\n%s\n' "$latest_tag" "$release_version" | sort -V | tail -n 1)" != "$release_version" ]]; }; then
              echo "::error::Release version $release_version must be greater than latest tag $latest_tag"
              exit 1
            fi

            sed -i -E '/^\[workspace.package\]/,/^\[/ s/^version = "[^"]+"/version = "'"$release_version"'"/' Cargo.toml

            if sed -n '/^profiled_config_macros = [{]$/,/^[}]$/p' Cargo.toml |
              grep -q '^    version = '; then
              sed -i -E '/^profiled_config_macros = [{]$/,/^[}]$/ s|^    version = "[^"]+",$|    version = "='"$release_version"'",|' Cargo.toml
            else
              sed -i -E '/^profiled_config_macros = [{]$/,/^[}]$/ s|^    path = "profiled-config-macros",$|    path = "profiled-config-macros",\n    version = "='"$release_version"'",|' Cargo.toml
            fi

            cargo check --workspace --all-features

            git add Cargo.toml Cargo.lock

            if ! git diff --cached --quiet; then
              git commit -m "chore(release): $release_version"
            fi

            git tag --annotate "$release_version" --message "Release $release_version"
          fi

          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Verify the release
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo package --package profiled_config_macros --locked

      - name: Push the release tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: |
          set -euo pipefail

          crate_exists() {
            cargo info --registry crates-io "$1@$RELEASE_VERSION" >/dev/null 2>&1
          }

          if crate_exists profiled_config_macros; then
            echo "profiled_config_macros@$RELEASE_VERSION is already published; skipping."
          else
            cargo publish --package profiled_config_macros --locked
          fi

          for attempt in {1..12}; do
            if crate_exists profiled_config_macros; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::profiled_config_macros@$RELEASE_VERSION did not appear in the crates.io index"
              exit 1
            fi

            echo "Waiting for profiled_config_macros@$RELEASE_VERSION to reach the crates.io index..."
            sleep 10
          done

          if crate_exists profiled_config; then
            echo "profiled_config@$RELEASE_VERSION is already published; skipping."
          else
            cargo publish --package profiled_config --locked
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION already exists; skipping."
          else
            gh release create "$RELEASE_VERSION" \
              --title "$RELEASE_VERSION" \
              --generate-notes \
              --verify-tag
          fi

          echo "### Released $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the next development snapshot
        shell: bash
        run: |
          set -euo pipefail

          IFS=. read -r release_major release_minor _release_patch <<< "$RELEASE_VERSION"
          next_base="$release_major.$((10#$release_minor + 1)).0"

          git fetch origin develop
          git checkout --force -B develop origin/develop

          develop_version="$(
            sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml |
              head -n 1
          )"

          if [[ "$develop_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            develop_base="${develop_version%-SNAPSHOT}"
          elif [[ "$develop_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            develop_base="$develop_version"
          else
            echo "::error::Invalid develop workspace version '$develop_version'; expected X.Y.Z or X.Y.Z-SNAPSHOT"
            exit 1
          fi

          if [[ "$develop_base" != "$next_base" ]] &&
            [[ "$(printf '%s\n%s\n' "$next_base" "$develop_base" | sort -V | tail -n 1)" == "$develop_base" ]]; then
            next_base="$develop_base"
          fi

          next_snapshot="$next_base-SNAPSHOT"

          sed -i -E '/^\[workspace.package\]/,/^\[/ s/^version = "[^"]+"/version = "'"$next_snapshot"'"/' Cargo.toml

          sed -i -E '/^profiled_config_macros = [{]$/,/^[}]$/{/^    version = /d;}' Cargo.toml

          if ! sed -n '/^profiled_config_macros = [{]$/,/^[}]$/p' Cargo.toml |
            grep -q '^    path = "profiled-config-macros",$'; then
            sed -i -E '/^profiled_config_macros = [{]$/a\    path = "profiled-config-macros",' Cargo.toml
          fi

          cargo check --workspace --all-features

          git add Cargo.toml Cargo.lock

          if git diff --cached --quiet; then
            echo "develop already uses $next_snapshot with local workspace dependencies; skipping."
            exit 0
          fi

          git commit -m "chore: prepare $next_snapshot"
          git push origin HEAD:develop

          echo "### Next development version: $next_snapshot" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the new development snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref develop
