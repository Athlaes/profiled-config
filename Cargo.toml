[workspace]
members = [".", "profiled-config-macros", "profiled-config-test"]
default-members = [
    ".",
    "profiled-config-macros",
    "profiled-config-test",
]

[workspace.package]
version = "0.4.0-SNAPSHOT"

[package]
name = "profiled_config"
version.workspace = true
edition = "2024"
description = "Typed, profile-based configuration for Rust applications"
license = "MIT"
repository = "https://github.com/Athlaes/profiled-config"
readme = "README.md"
keywords = ["configuration", "profiles", "serde", "toml", "json"]
categories = ["config"]
publish = ["crates-io"]

[features]
default = ["toml", "macros"]
macros = ["dep:profiled_config_macros", "auto-cli"]

auto-cli = []
ini = ["dep:serde_ini"]
yaml = ["dep:yaml_serde"]
toml = ["dep:toml"]

[dependencies]
include_dir = "0.7.4"
log = "0.4.33"
regex = "1.13.1"
serde-value = "0.7.0"
serde_core = "1.0.229"
serde_json = "1.0.151"
serde_json_path = "0.7.2"
thiserror = "2.0.20"
clap = { version = "4.6.2", features = ["derive"] }

yaml_serde = { version = "0.10.4", optional = true }
toml = { version = "1.1.3", optional = true }
serde_ini = { version = "0.2.0", optional = true }

profiled_config_macros = {
    path = "profiled-config-macros",
    optional = true
}

[dev-dependencies]
rstest = "0.26.1"
