[workspace]
members = [".", "profiled-config-macros", "profiled-config-test"]
default-members = [
    ".",
    "profiled-config-macros",
    "profiled-config-test",
]

[workspace.package]
version = "0.1.0"

[package]
name = "profiled_config"
version.workspace = true
edition = "2024"
description = "Typed, profile-based TOML configuration for Rust applications"
license = "MIT"
repository = "https://github.com/Athlaes/profiled-rust"
readme = "README.md"
keywords = ["configuration", "profiles", "serde", "toml"]
categories = ["config"]
publish = ["crates-io"]

[features]
default = []
macros = ["dep:profiled_config_macros"]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
include_dir = "0.7.4"
log = "0.4.33"
regex = "1.13.1"
serde_core = "1.0.229"
toml = "1.1.3"

profiled_config_macros = {
    version = "0.1.0",
    optional = true
}
