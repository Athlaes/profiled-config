[package]
name = "profiled_config_test"
version.workspace = true
edition = "2024"
publish = false

[features]
vault-e2e=["profiled_config/vault"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
profiled_config = { path = "..", features = ["macros", "toml", "ini", "yaml", "vault"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
vaultrs = "0.8.0"

[dev-dependencies]
testcontainers = "0.28.0"
